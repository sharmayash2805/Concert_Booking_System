services:
  - type: web
    name: concerthub-backend
    env: docker
    dockerfilePath: ./demo/Dockerfile
    dockerContext: ./demo
    plan: free
    envVars:
      - key: PORT
        value: 8081
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: concerthub-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: concerthub-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: concerthub-db
          property: password

databases:
  - name: concerthub-db
    plan: free
